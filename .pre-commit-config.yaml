# Local quality gates while GitHub Actions is unavailable.
# Install dependencies from requirements-dev.txt before running hooks.
# Install once per clone:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# Bump remote hook versions with: pre-commit autoupdate

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, chore, ci, build, perf]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
