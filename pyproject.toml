[project]
name = "ai-share-of-voice"
version = "0.1.0"
description = "Measures how often AI assistants mention and recommend a brand, and doubts its own results."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
